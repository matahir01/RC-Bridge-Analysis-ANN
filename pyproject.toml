[project]
name = "rc-bridge-analysis-ann"
version = "0.1.0"
description = "Deterministic RC bridge analysis/design with ANN surrogate and reliability modules"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pydantic>=2.8",
]

[project.optional-dependencies]
research = [
  "scikit-learn>=1.5",
  "tensorflow>=2.17",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]
packaging = [
  "pyinstaller>=6.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[project.scripts]
rc-bridge = "rc_bridge.application.cli:main"
rc-bridge-desktop = "rc_bridge.application.desktop:main"
