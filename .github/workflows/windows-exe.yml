name: windows-exe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/rc_bridge/application/**"
      - "pyproject.toml"
      - ".github/workflows/windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and builder
        shell: pwsh
        run: pip install -e ".[packaging]"
      - name: Smoke-test installed application modules
        shell: pwsh
        run: >-
          python -c "from rc_bridge.application.project_editor import
          application_default_project; p=application_default_project();
          assert p.geometry.girder_profile is not None"

      - name: Build standalone desktop executable
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name RCBridgeAnalysis
          src/rc_bridge/application/desktop.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: RCBridgeAnalysis-Windows
          path: dist/RCBridgeAnalysis.exe
