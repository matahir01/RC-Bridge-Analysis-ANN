name: cleanup-merged-branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete obsolete feature branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "actions-manager-1-to-6"
            "composite-t-and-lm1-optimization"
            "composite-t-lm1-optimization"
            "consolidated-verification-export"
            "design-workspace-and-barrier-impact"
            "integrated-action-design"
            "load-cases-combinations-workspace"
            "stage6-application-redevelopment"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
